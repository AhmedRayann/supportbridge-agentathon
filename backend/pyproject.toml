[project]
name = "supportbridge-backend"
version = "0.1.0"
description = "SupportBridge FastAPI backend"
requires-python = ">=3.12"
# Keep requirements.txt's local pip compatibility pins identical to this list.
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"
markers = ["postgresql: requires an explicitly configured disposable TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
